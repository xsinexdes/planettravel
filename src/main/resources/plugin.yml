name: PlanetTravel
version: 1.2.0
main: com.planettravel.PlanetTravel
api-version: '1.21'
author: TuServidor
description: Viaje entre el mundo "espacio" y mundos-planeta, con entorno, temperatura y atmosferas configurables.

# CoreNaves aun no existe / no esta instalado: se declara como softdepend para que,
# cuando exista, Bukkit lo cargue antes que este plugin y podamos engancharnos a su API
# mediante el ServicesManager. Si no esta presente, PlanetTravel sigue arrancando
# en "modo sin CoreNaves" (ver config.yml -> modo-sin-corenaves).
softdepend: [CoreNaves]

commands:
  planeta:
    description: Administra los planetas configurados
    usage: |
      /planeta crear <id> <mundoPlaneta> <radio>
      /planeta editar <id> <campo> <valores...>
      /planeta gui [id]
      /planeta listar
      /planeta teletransportar <id> [jugador]
      /planeta borrar <id>
      /planeta recargar
      /planeta validar
      /planeta area <id> [we]
      /planeta hacha
      /planeta traje <tier> [jugador] [pieza]
      /planeta info <id>
      /planeta espacio
    permission: planettravel.admin
    permission-message: No tienes permiso para administrar planetas.
  espacio:
    description: Menu de configuracion del espacio, bases espaciales y trajes
    usage: |
      /espacio
      /espacio hacha
      /espacio base <crear|borrar|tp|listar|oxigeno|temperatura|redefinir> ...
      /espacio traje <tier> [jugador] [pieza]
      /espacio estado
    permission: planettravel.admin
    permission-message: No tienes permiso para configurar el espacio.
  planetas:
    description: Abre el mapa estelar, o muestra la ficha de un planeta
    usage: /planetas [id]
    aliases: [mapaestelar, starmap]
    permission: planettravel.usar
    permission-message: No tienes permiso para usar el mapa estelar.

permissions:
  planettravel.admin:
    description: Permite administrar los planetas de PlanetTravel
    default: op
    children:
      planettravel.usar: true
  planettravel.usar:
    description: Permite abrir el mapa estelar
    default: true
